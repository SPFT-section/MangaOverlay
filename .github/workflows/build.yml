name: build
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: build-${{ github.ref }}, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Surface compile errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: MangaOverlay-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
