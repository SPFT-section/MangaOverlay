name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native tests (C++ ASan/UBSan)
        shell: bash
        run: |
          set -e
          I=app/src/main/cpp; F="-std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I $I"
          g++ $F native-tests/calc_test.cpp $I/calc.cpp -o /tmp/calc_test && /tmp/calc_test
          g++ $F native-tests/guess_test.cpp $I/wordguess.cpp -o /tmp/guess_test && /tmp/guess_test app/src/main/assets/freq_en.txt
          /tmp/guess_test app/src/main/assets/freq_en.txt app/src/main/assets/dict_en_th.tsv
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Surface compile errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: MangaOverlay-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
